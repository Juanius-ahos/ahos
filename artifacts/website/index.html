<!doctype html>
<html lang="en" class="js-intro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function () {
        var d = document.documentElement;
        try { var t = localStorage.getItem("ahos-theme"); if (t === "light" || t === "dark") d.dataset.theme = t; } catch (e) {}
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.remove("js-intro");
      })();
    </script>
    <link rel="preload" href="/fonts/anybody.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--head-->
  </head>
  <body>
    <div id="top"></div>
    <div id="root"><!--app--></div>
    <noscript><style>.js-intro .hero-mark .tile, .js-intro [data-split] { opacity: 1 !important; animation: none !important; }</style></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
